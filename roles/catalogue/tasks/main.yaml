- name: Disable current module # if module is not available then use shell cmd 
  ansible.builtin.command: dnf module disable nodejs -y 
- name: Enable nodejs 20 module
  ansible.builtin.command: dnf module enable nodejs:20 -y
- name: Install NodeJS
  ansible.builtin.package:
    name: nodejs 
    state: present
- name: create roboshop user
  ansible.builtin.user:
    name: roboshop
  # remove a directory if already exists 
- name: Recursively remove app directory and its contents
  ansible.builtin.file:
    path: /app
    state: absent
- name: create app directory
  ansible.builtin.file:
    path: /app 
    state: directory # directory otherwise it will create a file
- name: Download the catalogue application
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
    dest: /tmp/catalogue.zip
- name: unzip catalogue app
  ansible.builtin.unarchive:
    src: /tmp/catalogue.zip
    dest: /app
    remote_src: yes
- name: install dependencies
  ansible.builtin.command: npm install
  args:
    chdir: /app 
- name: Setup SystemD Catalogue Service
  ansible.builtin.copy:
    src: catalogue.service
    dest: /etc/systemd/system/catalogue.service
- name: Run daemon-reload only
  ansible.builtin.systemd_service:
    daemon_reload: true
# let's start the application after data is loaded
- name: copy mongodb repo
  ansible.builtin.copy:
    src: mongodb.repo
    dest: /etc/yum.repos.d/mongo.repo
- name: Install MongoDB client
  ansible.builtin.package:
    name: mongodb-mongosh
    state: present
- name: get the categories count
  ansible.builtin.command: mongosh --host mongodb.satyadaws.online --quiet --eval 'db=db.getSiblingDB("catalogue");db.products.countDocuments()'
  register: product_count
# - name: print the count 
#   ansible.builtin.debug:
#     msg: "product count: {{product_count.stdout}}"
- name: load catalogue data 
  ansible.builtin.shell: mongosh --host mongodb.satyadaws.online < /app/db/master-data.js
  when: product_count.stdout == "0" # keep double quotes
- name: Start and Enable catalogue Service
  ansible.builtin.service:
    name: catalogue
    state: started
    enabled: true