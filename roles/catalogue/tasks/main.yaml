# importing common tasks 

- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup
- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs
- name: mongodb setup
  ansible.builtin.import_role:
    name: common
    tasks_from: mongodb-setup


- name: Setup SystemD Catalogue Service
  ansible.builtin.copy:
    src: catalogue.service
    dest: /etc/systemd/system/catalogue.service
- name: Run daemon-reload only
  ansible.builtin.systemd_service:
    daemon_reload: true

  ansible.builtin.service:
    name: catalogue
    state: started
    enabled: true