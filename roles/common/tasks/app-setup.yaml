- name: create roboshop user
  ansible.builtin.user:
    name: roboshop
  # remove a directory if already exists 
- name: Recursively remove app directory and its contents
  ansible.builtin.file:
    path: /app
    state: absent
- name: create app directory
  ansible.builtin.file:
    path: /app 
    state: directory # directory otherwise it will create a file
- name: "Download the {{component}} application"
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{component}}-v3.zip
    dest: /tmp/catalogue.zip
- name: unzip {{component}} app
  ansible.builtin.unarchive:
    src: /tmp/{{component}}.zip
    dest: /app
    remote_src: yes